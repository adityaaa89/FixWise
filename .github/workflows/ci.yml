name: Repair or Replace Advisor CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Python Test Suites
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build Frontend Application
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Test Adaption Pipeline Lifecycle
        env:
          ADAPTION_MOCK_MODE: "true"
        run: |
          python -m unittest tests/test_adaption_pipeline.py -v

      - name: Test Deterministic Cost Engine (pytest)
        run: |
          pytest tests/test_cost_engine.py -v

      - name: Test FastAPI Backend Endpoints (pytest)
        env:
          ADAPTION_MOCK_MODE: "true"
        run: |
          pytest tests/test_main.py -v
